<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>LineRenderer</title>
  </head>
  <body style="text-align: center">
    <h1 id="#header">Loading WebGL, please wait</h1>
    <canvas id="unity-canvas" style="width: 960px; height: 600px; background: #231F20"></canvas>
    <script src="Build/V6.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/V6.data",
        frameworkUrl: "Build/V6.framework.js",
        codeUrl: "Build/V6.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "IntraFrames",
        productVersion: "1.0",
      });
      document.querySelector("#header").remove();
    </script>
  </body>
</html>
