<!DOCTYPE html><html lang="en"><head>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.1.9/lib/p5.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8">

  </head>
  <body>
    <script>
        let c; let r;
        let w; let h;
        let col_d; let col;
        let i; let l;
        let debug = false;
        let canv;
        let needed;
        let slider;
        let speed = 10;

        function cx(x) { return (width/2)+x; }
        function cy(y) { return (height/2)+y; }

        function setup(init = true) {
            if (init) {
                if (debug) canv = createCanvas(windowWidth, windowHeight);
                else createCanvas(windowWidth-10, windowHeight-40);

                slider = createSlider(10, 50, 20);
                slider.style('width', (width-25).toString()+'px');
                slider.position(12, height-25);
            }
            
            c = slider.value();
            w = width/1.5/c;
            h = height/1.5/c;
            r = c/2;
            
            background(250);
            frameRate(30);
            rectMode(CENTER);
            noStroke();
            textSize(width/height/c*100);
            textAlign(CENTER, CENTER);

            needed = getNeeded2(r*2+2);
            col_d = 600/needed.length;
            i = 0;
        }

        function draw() {
            if (slider.value() != c) setup(false);
            else if (needed[i+speed]) {
                for (let j = 0; j < speed; j++) {
                    col = i*col_d;
                    fill(255-col/2, col/2, col, 150);
                    stroke(255-col/2, col/2, col);
                    strokeWeight(4);
                    
                    if (l != null) line(cx(l[0]*w), cy(l[1]*h), cx(needed[i][0]*w), cy(needed[i][1]*h));
                    noStroke();
                    
                    circle(cx(needed[i][0]*w), cy(needed[i][1]*h), w/2, h/2);

                    fill(255, 255, 255);
                    text(i.toString(), cx(needed[i][0]*w), cy(needed[i][1]*h));

                    l = needed[i];
                    i++;
                }
            }
            else if (needed[i]) {
                col = i*col_d;
                fill(255-col/2, col/2, col, 150);
                stroke(255-col/2, col/2, col);
                strokeWeight(4);
                
                if (l != null) line(cx(l[0]*w), cy(l[1]*h), cx(needed[i][0]*w), cy(needed[i][1]*h));
                noStroke();
                
                circle(cx(needed[i][0]*w), cy(needed[i][1]*h), w/2, h/2);

                fill(255, 255, 255);
                text(i.toString(), cx(needed[i][0]*w), cy(needed[i][1]*h));

                l = needed[i];
                i++;
            }
        }

        function getNeeded(r) {
            let n = [];
            n.push([0, 0]);
                
            for (x = 1; x < r; x++) {
                n.push([ x,  0]);
                n.push([-x,  0]);
                n.push([ 0,  x]);
                n.push([ 0, -x]);
                
                for (y = 1; y < r; y++) {
                    n.push([ x,  y]);
                    n.push([-x,  y]);
                    n.push([ x, -y]);
                    n.push([-x, -y]);
                }
            }

            return n;
        }

        function getNeeded2(r) {
            let n = [];
            append(n, [0, 0]);

            let xdir = 0;
            let ydir = 0;
            let x = 0; let y = 0;
                
            for (i = 1; i < r; i += 2) {
                for (let x_ = x; x_ < i-i/2; x_++) {
                    n.push([x_, y]);
                }
                x += i;

                for (let y_ = y; y_ < i-i/2; y_++) {
                    n.push([x, y_]);
                }
                y += i;

                for (let x_ = x; x_ > -i+i/2; x_--) {
                    n.push([x_, y]);
                }
                x -= i+1;

                for (let y_ = y; y_ > -i+i/2; y_--) {
                    n.push([x, y_]);
                }
                y -= i+1;
            }
            return n;
        }
    </script>
</body></html>
