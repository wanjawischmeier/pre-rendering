<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>pre-rendering — Demos</title>
  <style>
    :root{
      --bg:#0f1720;
      --card:#0b1220;
      --muted:#9aa6b2;
      --accent:#6ad3ff;
      --glass: rgba(255,255,255,0.03);
      --gap:20px;
      --iframe-scale: 0.90; /* adjust zoom for embedded demos (1.0 = normal, <1 = zoom out) */
    }
    html,body{height:100%}
    body{
      margin:0;
      /* avoid requesting external fonts (prevents extra font loads that can trigger CSP messages) */
      font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:linear-gradient(180deg,#071019 0%, #071217 50%, #071019 100%);
      color:#e6eef6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:28px;
    }

    header{
      max-width:1200px;
      margin:0 auto 24px;
    }
    h1{margin:0 0 6px; font-size:22px}
    p.lead{margin:0 0 18px; color:var(--muted); font-size:13px}

    .grid{
      display:grid;
      /* make cards larger by increasing the min column size */
      grid-template-columns:repeat(auto-fit, minmax(380px,1fr));
      gap: var(--gap);
      max-width:1280px;
      margin:0 auto;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:14px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow: 0 8px 26px rgba(2,6,12,0.55);
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:180px;
      overflow:hidden;
    }

    .card .meta{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .title{font-weight:700; font-size:16px}
    .sub{color:var(--muted); font-size:13px}

    .actions{display:flex; gap:10px; align-items:center}
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      background:transparent;
      border-radius:9px;
      border:1px solid rgba(255,255,255,0.05);
      color:inherit;
      text-decoration:none;
      font-size:13px;
    }
    .btn.primary{
      background:linear-gradient(90deg, rgba(106,211,255,0.10), rgba(106,211,255,0.05));
      border:1px solid rgba(106,211,255,0.14);
      color:var(--accent);
    }

    .preview{
      width:100%;
      height:340px; /* increase preview height */
      border-radius:10px;
      overflow:hidden;
      background:linear-gradient(180deg,#051018,#06121a);
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px dashed rgba(255,255,255,0.03);
      position:relative;
    }
    .preview .placeholder{
      text-align:center;
      color:var(--muted);
      padding:16px;
      font-size:13px;
    }
    /* iframe scaling approach: make iframe larger than container and scale it down so content "zooms out" */
    .preview iframe{
      border:0;
      display:block;
      position:absolute;
      left:0;
      top:0;
      /* width/height will be set in JS based on --iframe-scale */
      transform-origin: 0 0;
      background:white;
    }

    .group-title{
      grid-column:1/-1;
      color:var(--muted);
      font-size:13px;
      margin:8px 0 0;
    }

    footer{max-width:1200px;margin:20px auto;color:var(--muted);font-size:13px;text-align:center}
    @media (max-width:420px){
      .preview{height:240px}
      .grid{grid-template-columns:repeat(auto-fit, minmax(260px,1fr));}
    }
  </style>
</head>
<body>
  <header>
    <h1>pre-rendering — Demos</h1>
    <p class="lead">If a demo refuses to be embedded (X-Frame-Options / Content-Security-Policy), use the "Open" link to view it in a new tab.</p>
  </header>

  <main class="grid" id="grid"></main>

  <script>
    const iframeScale = 0.90;

    // Data: list of demos. Paths are relative to this index.html (located in /demos/)
    const demos = [
      {group:'bounding-box', title:'symmetric', path:'./bounding-box/symmetric/'},
      {group:'bounding-box', title:'full', path:'./bounding-box/full/'},
      {group:'bounding-box', title:'directional', path:'./bounding-box/directional/'},

      {group:'buffering-order', title:'main (index.html)', path:'./buffering-order/'},
      {group:'buffering-order', title:'pure2.html', path:'./buffering-order/pure2.html'},
      {group:'buffering-order', title:'sketch.html', path:'./buffering-order/sketch.html'},
      {group:'buffering-order', title:'webgl (folder)', path:'./buffering-order/webgl/'},

      {group:'buffering-order-webgl', title:'webgl demo', path:'./buffering-order-webgl/'},

      {group:'initial-buffering-order', title:'index', path:'./initial-buffering-order/'},

      {group:'chunk-system', title:'index', path:'./chunk-system/'},

      {group:'cubemap-bounding-box', title:'index', path:'./cubemap-bounding-box/'},

      {group:'gpu-friendly-triangulation', title:'delaunay', path:'./gpu-friendly-triangulation/delaunay/'},
      {group:'gpu-friendly-triangulation', title:'vertex-grid', path:'./gpu-friendly-triangulation/vertex-grid/'},
      {group:'gpu-friendly-triangulation', title:'voronoi', path:'./gpu-friendly-triangulation/voronoi/'},

      {group:'grid-filtering', title:'index', path:'./grid-filtering/'},

      {group:'kd-tree', title:'index', path:'./kd-tree/'},

      {group:'latitude-crossection', title:'index', path:'./latitude-crossection/'},

      {group:'line-equation', title:'index', path:'./line-equation/'},

      {group:'line-renderer', title:'index', path:'./line-renderer/'},

      {group:'quadtree-optimization', title:'index', path:'./quadtree-optimization/'},

      {group:'scanline-rasterization', title:'index', path:'./scanline-rasterization/'},

      {group:'sphere-intersection', title:'index', path:'./sphere-intersection/'},

      {group:'transform-visualization', title:'index', path:'./transform-visualization/'},

      {group:'triangle-translation', title:'index', path:'./triangle-translation/'}
    ];

    const grid = document.getElementById('grid');

    // Group demos by group for structural display
    const groups = demos.reduce((acc,d)=>{
      acc[d.group] = acc[d.group] || [];
      acc[d.group].push(d);
      return acc;
    }, {});

    function createCard(demo){
      const card = document.createElement('div');
      card.className = 'card';

      const meta = document.createElement('div');
      meta.className = 'meta';

      const left = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = demo.group + (demo.title && demo.title !== 'index' ? ' — ' + demo.title : '');
      left.appendChild(title);
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = demo.path.replace(/^\.\//,'');
      left.appendChild(sub);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const open = document.createElement('a');
      open.className = 'btn';
      open.href = demo.path;
      open.target = '_blank';
      open.rel = 'noopener';
      open.textContent = 'Open';
      actions.appendChild(open);

      meta.appendChild(left);
      meta.appendChild(actions);
      card.appendChild(meta);

      const preview = document.createElement('div');
      preview.className = 'preview';

      // Immediately load iframe (all iframes loaded on page load)
      const ifr = document.createElement('iframe');
      ifr.src = demo.path;
      ifr.title = demo.group + ' / ' + demo.title;
      ifr.loading = 'eager';
      
      const scale = iframeScale;
      const inv = (1 / scale) * 100;
      ifr.style.width = inv + '%';
      ifr.style.height = inv + '%';
      ifr.style.transform = 'scale(' + scale + ')';
      ifr.style.transformOrigin = '0 0';

      // Do not set iframe.allow or sandbox to avoid Feature Policy warnings and excessive restrictions.
      preview.appendChild(ifr);
      card.appendChild(preview);
      return card;
    }

    function render(){
      grid.innerHTML = '';
      const groupsKeys = Object.keys(groups).sort();
      groupsKeys.forEach(g=>{
        const items = groups[g];
        if(items.length === 0) return;

        // group title row spanning the grid
        const gt = document.createElement('div');
        gt.className = 'group-title';
        gt.textContent = g;
        grid.appendChild(gt);

        items.forEach(it=>{
          const card = createCard(it);
          grid.appendChild(card);
        });
      });
    }

    // initial render and immediate iframe loading
    render();
  </script>
</body>
</html>
